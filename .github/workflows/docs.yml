name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "apps/web/scripts/**"
      - "apps/api/**"
      - "scripts/export_openapi.py"
      - "Makefile"
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.7
          python-version: 3.12.13
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: make docs
      - name: Verify generated API contracts
        run: git diff --exit-code -- docs/api/openapi.json apps/web/src/api/openapi-schema.ts
      - run: uv run python scripts/validate_repository.py
