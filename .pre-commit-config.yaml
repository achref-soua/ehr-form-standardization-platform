repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks working-tree scan
        entry: gitleaks dir . --redact --verbose
        language: system
        pass_filenames: false
        always_run: true
      - id: commitlint
        name: commitlint
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
        pass_filenames: false
