global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ehrfs-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: ehrfs-otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: ehrfs-ocr
    metrics_path: /metrics
    static_configs:
      - targets: ["ocr-cpu:8081"]
