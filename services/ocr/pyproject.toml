[project]
name = "ehrfs-local-ocr"
version = "0.1.0"
description = "Isolated local PaddleOCR process for synthetic and authorized evidence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "numpy==2.2.6",
  "paddleocr==3.7.0",
  # 3.3.1 regresses CPU inference in PaddleOCR through a PIR/oneDNN
  # attribute conversion failure. Keep this isolated runtime on the last
  # compatible 3.2 patch until the upstream regression is resolved.
  "paddlepaddle==3.2.2",
  "pillow==12.3.0",
  "prometheus-client==0.26.0",
  "python-multipart==0.0.32",
  "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["app.py"]
